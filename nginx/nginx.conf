# Reverse proxy: the only container with a published port.
# /api/v1/alerts -> alert-service; the rest of /api/v1 -> ingest-service.
# /health is healthy only if BOTH services are; per-service health and metrics are
# /ingest/{health,metrics} and /alert/{health,metrics}. Grafana (login) is at /grafana/.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream":"$upstream_addr"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    # Docker's embedded DNS. `resolve` re-resolves the upstream names, so a container
    # recreated by a deploy (new IP) is found without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream ingest {
        zone ingest 64k;
        server ingest-service:8000 resolve;
        keepalive 16;
    }

    upstream alert {
        zone alert 64k;
        server alert-service:8000 resolve;
        keepalive 8;
    }

    upstream grafana {
        zone grafana 64k;
        server grafana:3000 resolve;
    }

    # WebSocket upgrade for Grafana Live; plain keepalive otherwise.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    server {
        listen 80 default_server;

        # MAX_BATCH_SIZE=1000 observations is ~250 KB of JSON.
        client_max_body_size 2m;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        location /api/v1/alerts {
            proxy_pass http://alert;
        }

        location /api/v1/ {
            proxy_pass http://ingest;
        }

        # Combined health: auth_request runs the alert-service check first; if it is not
        # 2xx nginx answers 503, otherwise the ingest-service check decides.
        location = /health {
            access_log off;
            auth_request /_alert_health;
            error_page 500 = @unhealthy;
            proxy_pass http://ingest/health;
        }

        location = /_alert_health {
            internal;
            proxy_pass http://alert/health;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location @unhealthy {
            default_type application/json;
            return 503 '{"error":"unhealthy","message":"alert-service is unhealthy","details":[]}';
        }

        # Per-service health and metrics.
        location = /ingest/health  { proxy_pass http://ingest/health; }
        location = /ingest/metrics { proxy_pass http://ingest/metrics; }
        location = /alert/health   { proxy_pass http://alert/health; }
        location = /alert/metrics  { proxy_pass http://alert/metrics; }

        # Grafana serves from the /grafana/ sub-path itself, so the URI is passed unchanged.
        location /grafana/ {
            proxy_pass http://grafana;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # nginx's own liveness, for its container healthcheck.
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            default_type application/json;
            return 404 '{"error":"not_found","message":"no such endpoint","details":[]}';
        }
    }
}
