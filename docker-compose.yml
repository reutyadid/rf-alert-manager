# RF Alert Manager stack: nginx -> ingest-service / alert-service -> PostgreSQL + Redis,
# plus Prometheus (internal only) and Grafana (behind nginx at /grafana/).
# Configuration comes from .env (copy .env.example). Only nginx publishes a port.
#   Local:  docker compose up -d --build
#   VM:     IMAGE_TAG=<commit sha> docker compose pull && docker compose up -d

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF: unacked rule_match entries survive a Redis restart (DECISIONS §1, §8.5).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  ingest-service:
    image: ghcr.io/reutyadid/rf-ingest-service:${IMAGE_TAG:-local}
    build: ./ingest_service
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logging

  alert-service:
    image: ghcr.io/reutyadid/rf-alert-service:${IMAGE_TAG:-local}
    build: ./alert_service
    restart: unless-stopped
    env_file: .env
    # Same values as .env, but the shell can override them (scripts/demo-webhooks.sh).
    environment:
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      ingest-service:
        condition: service_healthy
      alert-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Bounded disk: whichever limit is reached first.
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging: *logging

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    # Only what Grafana needs; not env_file, so it never sees the database password.
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rf-alert-manager.json
    # No volume: datasource and dashboard are provisioned from git on every start.
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    logging: *logging

  # Demo only: started with `--profile demo` (scripts/demo-webhooks.sh). Not deployed, not in
  # the smoke test. No env_file, so it never sees the database password.
  webhook-receiver:
    build: ./webhook_receiver
    profiles: [demo]
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      FAIL_FIRST_N: ${FAIL_FIRST_N:-0}
    mem_limit: 64m
    logging: *logging

volumes:
  pgdata:
  redisdata:
  promdata:
