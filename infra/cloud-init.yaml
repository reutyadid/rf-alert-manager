#cloud-config
# Provisions the RF Alert Manager VM (Ubuntu 24.04):
# Docker + compose plugin, Docker on boot, bounded logs, firewall allowing only SSH and HTTP.

package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - ufw

write_files:
  # Default log rotation for every container (compose may override per service)
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
  # Bound the host's own journal as well
  - path: /etc/systemd/journald.conf.d/size.conf
    content: |
      [Journal]
      SystemMaxUse=200M

runcmd:
  # Docker CE from Docker's official apt repository
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now containerd docker
  - systemctl restart systemd-journald
  - usermod -aG docker ubuntu
  # Deploy target for the compose stack (Part 2/3)
  - install -d -o ubuntu -g ubuntu /opt/rf-alert-manager
  # Firewall: only SSH and HTTP. Note: Docker-published ports bypass ufw,
  # so only nginx may publish a port; postgres/redis stay on the internal network.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw --force enable

final_message: "rf-vm provisioned after $UPTIME seconds"
