# Scrapes both services over the internal compose network (not through nginx).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ingest-service
    static_configs:
      - targets: ["ingest-service:8000"]
  - job_name: alert-service
    static_configs:
      - targets: ["alert-service:8000"]
