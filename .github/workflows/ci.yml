# CI: lint, unit tests and integration tests on every pull request and push.
# Runs on GitHub-hosted runners only; the self-hosted runner on the VM is used for deploy only
# (DECISIONS §9). The Deploy workflow runs only after a green CI on main, so a failing test
# blocks the deploy (branch protection is not available on this plan, DECISIONS §10).
name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements*.txt"
      - run: pip install -r ingest_service/requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  # Each service pins its own dependency versions (its own image), so each is tested in
  # its own environment.
  unit-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The simulator tests check its scenarios against ingest's rules and validation.
          - { service: ingest_service, paths: "ingest_service simulator" }
          - { service: alert_service, paths: "alert_service" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements*.txt"
      - run: pip install -r ${{ matrix.service }}/requirements-dev.txt
      # Domain and API tests with in-memory fakes and a fake clock: no DB, no Redis.
      - run: pytest -q -m "not integration" ${{ matrix.paths }}

  integration-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [ingest_service, alert_service]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test  # throwaway CI database, not a real secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      INGEST_IT_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
      INGEST_IT_REDIS_URL: redis://localhost:6379/15
      ALERT_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
      ALERT_TEST_REDIS_URL: redis://localhost:6379/14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements*.txt"
      - run: pip install -r ${{ matrix.service }}/requirements-dev.txt
      # The integration tests skip themselves when their env vars are missing. Here a skip
      # means misconfiguration, so it fails the job instead of passing silently.
      - name: pytest -m integration (fails on any skip)
        run: |
          pytest -q -m integration -rs ${{ matrix.service }} | tee pytest.out
          if grep -q "skipped" pytest.out; then
            echo "::error::integration tests were skipped; check the service env vars"
            exit 1
          fi
