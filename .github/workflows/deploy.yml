# Build & Publish -> Deploy -> Verify, after CI succeeds on main.
# Rollback: Actions -> Deploy -> Run workflow -> image_tag = an earlier commit SHA
# (skips the build and deploys that image from GHCR). See DECISIONS §9.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Full commit SHA of an image already in GHCR (rollback / redeploy)"
        required: true

permissions:
  contents: read

# One deployment at a time; never cancel one that is running.
concurrency:
  group: deploy-vm
  cancel-in-progress: false

env:
  TAG: ${{ inputs.image_tag || github.event.workflow_run.head_sha }}
  REGISTRY: ghcr.io/reutyadid

jobs:
  build:
    # Only for a green CI run on a push to main (not for a manual rollback).
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [ingest-service, alert-service]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.service }}:${{ env.TAG }}
        uses: docker/build-push-action@v6
        with:
          # ingest-service -> ./ingest_service
          context: ./${{ matrix.service == 'ingest-service' && 'ingest_service' || 'alert_service' }}
          push: true
          tags: ${{ env.REGISTRY }}/rf-${{ matrix.service }}:${{ env.TAG }}
          # Links the package to this repo, so the deploy job's GITHUB_TOKEN can pull it.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: [self-hosted, rf-vm]
    permissions:
      contents: read
      packages: read
    steps:
      # Remembered before anything changes, so a failed deploy can go back to it.
      - name: Record the running version
        id: running
        run: echo "tag=$(sed -n 's/^IMAGE_TAG=//p' /opt/rf-alert-manager/.env)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          # Compose, nginx and observability config of the same commit as the images.
          ref: ${{ env.TAG }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy ${{ env.TAG }}
        run: bash infra/vm-release.sh "$TAG" "$GITHUB_WORKSPACE"
      # Automatic rollback when the deploy itself fails (e.g. a container cannot start):
      # redeploy the version that was running, with that commit's own config files.
      - name: Check out the running version
        if: failure() && steps.running.outputs.tag != ''
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.running.outputs.tag }}
          path: rollback
      - name: Roll back to ${{ steps.running.outputs.tag }}
        if: failure() && steps.running.outputs.tag != ''
        env:
          RUNNING: ${{ steps.running.outputs.tag }}
        run: |
          echo "::warning::deploy of $TAG failed, rolling back to $RUNNING"
          bash rollback/infra/vm-release.sh "$RUNNING" "$GITHUB_WORKSPACE/rollback"
          bash /opt/rf-alert-manager/infra/smoke-test.sh "$RUNNING"

  verify:
    needs: deploy
    runs-on: [self-hosted, rf-vm]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Smoke test
        run: bash /opt/rf-alert-manager/infra/smoke-test.sh "$TAG"
      # Automatic rollback: the new version is unhealthy, so go back to the previous one,
      # with that commit's own config files. The pipeline still fails, so the bad commit is
      # visible.
      - name: Read the previous version
        id: previous
        if: failure()
        run: echo "tag=$(cat /opt/rf-alert-manager/.previous-tag)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: failure()
        with:
          ref: ${{ steps.previous.outputs.tag }}
          path: rollback
      - uses: docker/login-action@v3
        if: failure()
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Roll back to ${{ steps.previous.outputs.tag }}
        if: failure()
        env:
          PREVIOUS: ${{ steps.previous.outputs.tag }}
        run: |
          echo "::warning::smoke test failed for $TAG, rolling back to $PREVIOUS"
          bash rollback/infra/vm-release.sh "$PREVIOUS" "$GITHUB_WORKSPACE/rollback"
          bash /opt/rf-alert-manager/infra/smoke-test.sh "$PREVIOUS"
